<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#121212" />
<style type="text/css">
body,html {
		height: 100%;
		margin: 0;
		padding: 0;
		overflow: hidden;
		background-color: #121212; /* same onyx as talonsmith.com */
	}
/* The game draws at a fixed 750x500; the canvases are scaled up to fill the screen at 3:2 */
:root {
	--game-w: min(100vw, 150vh);
	--game-h: min(100vh, 66.6667vw);
}
#bottom{
	
	background-image: url(assets/bg.jpg);
	background-size: 100% 100%;
}

#fork{
	display: block;
	position: absolute;
	right: 0;
	top: 0;
	width: 149px;
	height: 149px;
	cursor: pointer;
	background-image: url(assets/forkme.png);
	z-index: 0;
}
#info a{
	color: #666666;
}
#info
{
	display:block;
	position: fixed;
	z-index: 1;
	left: 0;
	right: 0;
	bottom: 8px;
	text-align: center;
	pointer-events: none;
	color:#888888;
	font: 13px sans-serif;
}
#loading{
	position: absolute; 
	z-index: 0;
	left: 50%;
	top: 50%;
	width: 32px;
	height: 32px;
	margin: -16px auto auto -16px;
	background-image: url(assets/loading.gif);
}
.canvas{
	display:none;
	position: absolute; 
	z-index: 0;
	left: 50%;
	top: 50%;
	width: var(--game-w);
	height: var(--game-h);
	transform: translate(-50%, -50%);
	touch-action: none; /* lets a finger swipe slice instead of scrolling */
}
video{
	display:none;
	position: absolute; 
	z-index: 0;
	left: 50%;
	top: 50%;
	width: 150px;
	height: 100px;
	margin: -250px auto auto -375px;
	
}
</style>
<title>Jem's Bottle Breaker</title>
<script src="js/libs/preloadjs-0.6.0.min.js"></script>
<script src="js/libs/soundjs-0.6.0.min.js"></script>

<script src="js/src/Module_bomb.js"></script>

<script src="js/src/Module_blade.js"></script>
<script src="js/src/Module_ui.js"></script>
<script src="js/src/Main.js?v=2"></script>
<script src="js/src/ShadowRenderer.js"></script>

<script type="text/javascript" src="js-handtracking/src/handtracking.js"></script> 
</head>
